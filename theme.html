<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG Modder Gaming Hub</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #111;
            color: #eee;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        
        header {
            background: #000;
            padding: 1rem;
            border-bottom: 2px solid #4CAF50;
        }
        
        .banner {
            width: 100%;
            height: 300px;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://via.placeholder.com/1200x300') no-repeat center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .banner h1 {
            font-size: 3em;
            text-shadow: 2px 2px 4px #000;
            color: #4CAF50;
        }
        
        nav {
            background: #222;
            padding: 0.5rem;
        }
        
        nav ul {
            display: flex;
            list-style: none;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        nav ul li {
            margin: 0 15px;
        }
        
        nav ul li a {
            color: #4CAF50;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .post {
            background: #222;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        .post h2 {
            color: #4CAF50;
            margin-top: 0;
        }
        
        footer {
            background: #000;
            padding: 1rem;
            text-align: center;
            border-top: 2px solid #4CAF50;
        }
        
        @media (max-width: 768px) {
            nav ul {
                flex-direction: column;
                align-items: center;
            }
            nav ul li {
                margin: 5px 0;
            }
            .banner h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="banner">
            <h1>SG MODDER GAMING HUB</h1>
        </div>
    </header>
    
    <nav>
        <ul>
            <li><a href="#">Home</a></li>

            <li><a href="#">Cheats</a></li>
            <li><a href="#">Downloads</a></li>
            <li><a href="#">Forum</a></li>
        </ul>
    </nav>
